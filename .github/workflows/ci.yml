name: ci

on:
  push:
  pull_request:

jobs:
  check-sync:
    # The synced spec copies must match the root spec, byte for byte.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make check-sync

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./bindings/python[dev]
      - run: make sync
      - run: python -m pytest -q conformance
      - run: ruff check bindings/python

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The Rust conformance test shells out to the Python generator (the single
      # spec-driven emitter), so the Rust job needs the emit deps too.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./bindings/python[emit]
      - run: make sync
      - run: cd bindings/rust && cargo test
