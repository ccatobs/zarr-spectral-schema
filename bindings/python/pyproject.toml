[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zarr-spectral-schema"
version = "0.1.0"
description = "Source of truth for the CCAT/CHAI L0–L1 Zarr store contract (Python binding)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    # Opens a local path or a URL; the validator reads zarr.json objects only.
    "fsspec>=2023.1",
]

[project.optional-dependencies]
# s3:// URLs (fsspec's S3 implementation).
s3 = ["s3fs>=2023.1"]
# zarr is needed only to EMIT reference stores (conformance generator); the
# validator reads zarr.json directly and needs no zarr dependency. moto serves
# the emitted stores from an in-process S3 endpoint (conformance/s3_server.py)
# for the object-storage tests of both bindings.
emit = ["zarr>=3.0", "numpy>=1.24", "moto[server]>=5.0", "s3fs>=2023.1"]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "zarr>=3.0",
    "numpy>=1.24",
    "moto[server]>=5.0",
    "s3fs>=2023.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zarr_spectral_schema"]

# The spec is shipped as package data (synced copy of repo-root spec/schema.yaml,
# plus the meta-schema), loaded at runtime via importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"src/zarr_spectral_schema/spec/schema.yaml" = "zarr_spectral_schema/spec/schema.yaml"
"src/zarr_spectral_schema/spec/meta-schema.json" = "zarr_spectral_schema/spec/meta-schema.json"

[tool.ruff]
line-length = 100
