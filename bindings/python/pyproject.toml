[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zarr-spectral-schema"
version = "0.1.0"
description = "Source of truth for the CCAT/CHAI L0–L1 Zarr store contract (Python binding)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
# zarr is needed only to EMIT reference stores (conformance generator); the
# validator reads zarr.json directly and needs no zarr dependency.
emit = ["zarr>=3.0", "numpy>=1.24"]
dev = ["pytest>=7.0", "ruff>=0.4", "zarr>=3.0", "numpy>=1.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/zarr_spectral_schema"]

# The spec is shipped as package data (synced copy of repo-root spec/schema.yaml,
# plus the meta-schema), loaded at runtime via importlib.resources.
[tool.hatch.build.targets.wheel.force-include]
"src/zarr_spectral_schema/spec/schema.yaml" = "zarr_spectral_schema/spec/schema.yaml"
"src/zarr_spectral_schema/spec/meta-schema.json" = "zarr_spectral_schema/spec/meta-schema.json"

[tool.ruff]
line-length = 100
