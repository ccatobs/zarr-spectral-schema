# spec/schema.yaml — THE SPEC (single source of truth).
#
# The single hand-authored, language-neutral source of truth for the on-disk
# Zarr "storage language" of the CCAT/CHAI heterodyne pipeline (zarr-fits writes
# L0, calibrate writes L1, YODA reads). This is the ONLY authored copy: the
# per-binding copies under bindings/*/.../spec/schema.yaml are mechanically
# synced from this file (`make sync`, verified in CI) — never hand-edited.
#
# Scope (#5, full L0+L1 contract): the FULL L0+L1 structural contract. Every array AND every on-disk
# attr the writers emit is declared, with real dtype/ndim mirroring what
# zarr-fits-core (L0) and cal-io (L1) actually write, plus per-level placement.
# The hard-coded L1 arrays (t_off/s_h_obs/t_sky_fit/t_cal) now generate consts;
# on-disk attrs that are NOT cal-schema constants (store_version,
# cal_engine_version, …) live in the per-level `*_attrs` sections (no const).
#
# Placement model (interpreted by both validators, never hand-branched): a store
# is L0 or L1, detected by its root `detect` attr. Each group declares `placement`
# (`scan_or_band`, the only one) + `inline` (true ⇒ arrays sit directly in the target
# dir; false ⇒ under `<target>/<groupname>/`). A scan group is multi-frontend iff
# it has ≥1 `band_<M>` child; `scan_or_band` then resolves to each band group,
# and a `scan_or_band_attrs` attr on the scan group itself is an error.
#
# Parse rule (both validators, one grammar): every zarr.json is strict JSON. A
# non-finite number (NaN, Infinity, -Infinity) is an error of its own
# ("non-finite number in metadata"); any other zarr.json that does not parse to
# a JSON object, or nests more than 127 arrays and objects (the limit of
# serde_json), is "malformed metadata". Neither validator raises; the node is
# left out of the walk. data_type may take the string form or the object form
# ({name: ...}); a node whose node_type differs from the one the spec names is
# an error. Versions and scan/band names are ASCII digits only. Every structure
# finding starts with "[<level>] "; version and level-detection errors do not.
#
# ── Storage rules (#20, object storage; ADR-0008) ──
#
# Object storage. A store is a local path or an object-store URL
# (s3://bucket/store.zarr). An argument that starts with scheme:// is a URL, and
# its path is percent-decoded; anything else is a local path, taken as it is.
# Both validators read only zarr.json objects: they list the children of each
# group node and stop at an array node, so they never list or open a chunk key.
# A directory without a zarr.json is not a node, and the local walk does not
# follow a symlinked directory. An I/O failure is an error, never a gap: a
# group that cannot be listed is "'<rel>/': cannot list", a zarr.json that
# cannot be read is "'<rel>': cannot read metadata" ([<level>] structure
# findings; at the root, the only error).
#
# Chunk independence (invariant). A reader gives the same result for any chunk
# shape and any shard shape. The contract states no chunk rule; a reader that
# depends on the chunk shape of one writer breaks this invariant. The
# conformance set holds l0_sharded.zarr and l1_sharded.zarr, whose chunk layout
# differs from the writer default.
#
# Recommended layout (non-binding; binds no producer). For each 5-D array
# (C, D, R, A, S): one shard per pixel and subscan, shard shape (C, D, 1, 1, 1),
# with inner chunks of about 1 MB uncompressed (0.5 to 4 MB; e.g. (C, 4, 1, 1, 1)
# for 64k float32 channels, (C, 2, 1, 1, 1) for float64). Shard target: 16 MB to
# 512 MB uncompressed; when one pixel and subscan exceeds 512 MB, split D into
# equal parts. Why: a reader of one pixel or one subscan fetches one object, an
# inner chunk is the unit of a ranged read, a writer holds one shard in memory,
# and an object store charges per request (objects far below 1 MB make reads
# request-bound). One shard per array, as written today, gives one 403 GB
# spectra object for a 10-minute OTF scan of 2x64 pixels, 64k channels at 10 Hz.
#
# Consolidated metadata (decision). A finished store MAY hold consolidated
# metadata: zarr-python's inline form (`consolidated_metadata` with
# kind: inline, must_understand: false) in the root zarr.json, written by the
# producer as its last write, after every completeness marker. It is
# recommended for a finished store read with zarr-python over object storage
# (one GET instead of one listing per group and one GET per node). It is never
# required and never authoritative: the validators ignore it and check each
# node's own zarr.json, and a reader that uses it still skips a unit without
# its completeness marker. Why not required: it is a zarr-python convention,
# not part of the Zarr v3 core spec; zarrs 0.23 (calibrate) writes it
# (Node::consolidate_metadata + Group::set_consolidated_metadata, verified to
# open with zarr.open_consolidated) but does not read it; a streaming store
# gains units after each write, so a root cache is stale between appends; and
# no real store holds it, so a requirement would reject every existing store.
#
# One writer per store (ADR-0008 amendment). One producer writes a store:
# zarr-fits writes an L0 store, calibrate writes an L1 store. A consumer (YODA)
# writes no group into the store of a producer; it writes its output to a store
# of its own. A link from one store to another (source_l0_store) is a URI
# reference.
#
# Codegen rule (build.rs): each array/group/version yields a Rust `pub const`.
# Default identifier: array → UPPER(on-disk name); group → UPPER(name)_GROUP;
# version → UPPER(attr key). Override with `const:`; suppress a group const with
# `const: false`. `lists:`/`markers:` yield `&[&str]`/`&str` consts directly.
# The new group fields (placement/inline) and the `*_attrs` sections generate NO
# consts — they are validator data only. An attr may carry `equals: <value>`
# (value constraint): when present, the attr must hold exactly that value; and
# `format: uri-reference` (RFC 3986 URI reference, not empty, not an absolute
# path, not a file: URI). An array entry may carry `attrs` (the array's own
# attrs, same rules)
# a dtype set (`dtype: [float64, float32]`: any name of the set), and
# `fill_value` (an integer: the array's Zarr metadata must declare exactly it).
# An attr may carry `enum: [...]`, its value set: the attr holds one of these.
# A number or integer attr may carry `minimum`/`maximum`, inclusive bounds.
# An attr with `sentinel: true` may hold the not-applicable sentinel instead of a
# value: "NONE" for a string, JSON null for a number (ADR-0007). A required
# field is always present. NaN is an array fill value only, never an attr value.
#
# Dimensions (#19, dimensions, units, frame): each array declares `dims`, its ordered axis names; producers
# write them as the zarr v3 `dimension_names` field. Arrays at one placement
# target (a scan group, or a band group of a multi-frontend scan) that share an
# axis name agree on its length. The axis vocabulary (meta-schema `dimension`):
# channel (C), dump (D), receiver (R, a pixel of an array), array (A, a
# frontend-backend pair), subscan (S) and load_dump (the length-1 dump axis of a
# load-temperature table); a `dims` item outside it is a spec error.
#
# Units (#19, dimensions, units, frame): an array that holds a physical quantity declares `units`, a FITS
# unit string as astropy parses it (`K`, `Hz`, `km/s`, `deg`, `rad`, `s`; "" for
# a dimensionless quantity). Producers write it as the array's `units` attr.
# Labels, indices, scan numbers, counts of items (n_valid_dumps), strings and
# the `flags` bitmask declare none, and hold no `units` attr (a finding).
# Units compare as strings, exactly (ADR 0012): `ct / (K s)` is not `ct/(K s)`.
# A scalar attr carries its unit as a name suffix (`pwv_mm`, `site_latitude_deg`).

# This repo's package version. OFF-DISK (provenance only) — never on disk.
spec_version: "0.1.0"

# Producer-owned, ON-DISK version attributes. Consumer checks `>= min_supported`
# (warn newer-minor, error newer-major) — two-axis negotiation. `min_supported`
# names the oldest version whose stores pass the structural check below.
versions:
  l0_schema_version:            # → const L0_SCHEMA_VERSION
    level: L0
    on_disk: integer            # zarr-fits writes this root attr as a JSON integer
    # 3 (#19, dimensions, units, frame): identity and l0_complete required, dims/units, site location,
    # scan_N/band_B layout. Also in 3: uint32 counts with their fill value
    # (#27, L0 count dtype), and per-pixel frontend_backends and raw_fits_headers [R,A,S]
    # (kalibrate#101, write the extended contract), the `arrays` attr and backend/obs_id/spectel1 at
    # scan-or-band placement (#34, two spec gaps). The validator accepts the current major only.
    # Also in 3, additive (#50, time stamp per dump): the optional dump step input
    # arrays otf_clear, bck_len, spec_time, otf_srcyc.
    # Also in 3, additive (#58, maintainer answers on the frame set): the optional scan
    # attrs v_frame_kms, spectel2, instcfg, datasrc; velocity_source_kms may hold
    # the null sentinel.
    value: "3"
    min_supported: "3"
  cal_schema_version:           # on-disk attr name; Rust const is L1_SCHEMA_VERSION
    level: L1
    on_disk: string             # cal-io writes this root attr as a JSON string
    # 2.0 (#19, dimensions, units, frame): dims/units, the required frame set, identity required and at
    # band placement with the quality record and provenance in multi-frontend
    # stores. Also in 2.0: gamma in ct/(K s), counts per second per kelvin
    # (kalibrate#101, write the extended contract), backend/obs_id/spectel1 at scan-or-band placement and
    # image_gain (#34, two spec gaps). The validator accepts the current major only.
    # 2.1 (#50, time stamp per dump): the optional dump_mjd array (additive).
    # 2.2 (#58, maintainer answers on the frame set): v_frame holds the frame
    # correction from the L0 velocity_source_kms and v_frame_kms;
    # the optional scan attrs spectel2, instcfg, datasrc (additive).
    # 2.3 (#54, per-pixel PWV): the optional pwv_spectrum and
    # tau_signal_spectrum arrays (additive).
    value: "2.3"
    min_supported: "2.0"
    const: L1_SCHEMA_VERSION

# The structural contract, per data level. Each level holds named groups; each
# group holds named arrays (on-disk name = the key). dtype/ndim mirror the writers.
levels:
  L0:
    # A store is L0 iff its root group carries this attr (slice-4 detection).
    detect: l0_schema_version
    # A scan is single-purpose (CONTEXT.md): each scan group holds exactly one of
    # these groups. Only the present group's arrays are checked; both or neither
    # is an error.
    one_of: [source, calibration]
    # Root-group session attrs (zarr-fits-core writer.rs:61-103). All are written
    # unconditionally, but profile/site/observer/fits_folder may be empty
    # placeholders on partial sessions, so only the always-meaningful identity +
    # provenance keys are required (decision: do not over-constrain real stores).
    root_attrs:
      store_version:      { type: string,  required: true }
      zarr_fits_version:  { type: string,  required: true }
      telescope:          { type: string,  required: true }
      date_obs:           { type: string,  required: true }
      created_by:         { type: string,  required: true }
      observer:           { type: string,  required: false }
      fits_folder:        { type: string,  required: false }
      profile_name:       { type: string,  required: false }
      profile_version:    { type: integer, required: false }
      observatory:        { type: string,  required: false }
      # Observatory location (#19, dimensions, units, frame): required. An airborne observatory has no
      # fixed site and writes the not-applicable sentinel.
      site_latitude_deg:  { type: number,  required: true, sentinel: true }
      site_longitude_deg: { type: number,  required: true, sentinel: true }
      site_altitude_m:    { type: number,  required: true, sentinel: true }
    # Per-scan-group attrs (writer.rs:122-145): what all bands of a scan share.
    # Verbatim identity passthrough (mission_id, aor_id) comes from
    # scan_attrs.metadata and is store-dependent → required:false.
    scan_attrs:
      scan_number:         { type: integer, required: true }
      source:              { type: string,  required: true }
      instmode:            { type: string,  required: true }
      date_obs:            { type: string,  required: true }
      telescope:           { type: string,  required: true }
      observer:            { type: string,  required: true }
      # Source velocity (#52, frame of the source velocity): the systemic
      # velocity of the source in km/s. Frame: the kinematic local standard of
      # rest (LSRK). Convention: relativistic. The KOSMA control software tunes
      # the LO with this value (kosma_software 2c4f8d71c obsdop.c:377-437, lo_server.c:863-870).
      # FITS keyword: RVSYS for SOFIA/GREAT, VELOCITY for CCAT/CHAI and the
      # other KOSMA profiles. For an ephemeris source (name starts with @ or #)
      # the control software ignores the value. calibrate copies it into the L1
      # attr vlsr_source. A header without the keyword gives the null sentinel
      # (#58, maintainer answers on the frame set), never 0.
      velocity_source_kms: { type: number,  required: true, sentinel: true }
      # Total velocity (#58, maintainer answers on the frame set): the FITS
      # keyword VFRAME, raw. The total topocentric line-of-sight velocity in
      # km/s that the KOSMA control software tunes the LO to: the source
      # velocity plus the motion of the observer (write_fits_kosma.c,
      # scan.dop_vtot; written by every build). A line of the source sits at
      # topocentric velocity v_frame_kms (ORION: RVSYS 10, VFRAME 15.0, line at
      # 15 km/s). Not the frame correction: L1 v_frame is
      # velocity_source_kms - v_frame_kms. One value per scan: every record of
      # a scan holds the same value in all parity datasets. Optional: added
      # within L0 3; absent => a header without VFRAME or a store written
      # before L1 2.2.
      v_frame_kms:         { type: number,  required: false }
      lloadsn:             { type: integer, required: true }
      mission_id:          { type: string,  required: false }
      aor_id:              { type: string,  required: false }
      # spectel2, instcfg, datasrc (#43, spec wording gaps; #58, maintainer answers on the frame set): verbatim
      # passthrough of the FITS keywords SPECTEL2, INSTCFG and DATASRC
      # (SOFIA/GREAT). They belong to the scan group, also for a multi-frontend
      # scan: every record of a scan holds the same value (all multi-frontend
      # SOFIA/GREAT parity datasets). zarr-fits takes the value of band 0.
      spectel2:            { type: string,  required: false }
      instcfg:             { type: string,  required: false }
      datasrc:             { type: string,  required: false }
    # Multi-frontend layout (#19, dimensions, units, frame): frontend b of scan N sits at scan_N/band_b/,
    # as at L1. There is no virtual scan number. Per-band-group attrs:
    band_attrs:
      band_index:       { type: integer, required: true }
    # Attrs of one frontend: at the scan group when single-frontend, at each
    # band group when multi-frontend (a scan-or-band attr on the scan group of a
    # multi-frontend scan is an error).
    scan_or_band_attrs:
      line:             { type: string,  required: true }
      rest_freq_hz:     { type: number,  required: true }
      # Verbatim identity passthrough of one frontend (#34, two spec gaps), store-dependent →
      # required:false. On the scan group of a multi-frontend scan one value
      # would be band 0's.
      backend:          { type: string,  required: false }
      obs_id:           { type: string,  required: false }
      spectel1:         { type: string,  required: false }
      # ── Identity + provenance (required since L0 3, #19 (dimensions, units, frame)). The law (ADR-0007):
      # identity is producer-written and forwarded, never re-derived. `frontend`
      # is written here at L0 and forwarded L0→L1 (retiring the fragile
      # longest-common-prefix re-derivation).
      frontend:         { type: string, required: true }
      # Array names (#34, two spec gaps), in the order of the array axis A; pixels_per_array
      # follows this order (identical L0/L1).
      arrays:           { type: array, required: true }
      # Per-array pixel layout, canonical = a LIST OF LISTS positionally aligned
      # with the `arrays` order (identical L0/L1). Declared `type: array`
      # ONLY: the legacy HashMap/dict representation (nondeterministic key order)
      # is deliberately NOT admitted — a JSON object fails `type: array`, so the
      # dict form cannot be lifted. The generic validator type-checks the outer
      # array; the inner per-array string lists are writer-enforced.
      pixels_per_array: { type: array, required: true }
      # Verbatim source-keyword provenance for the resolved identity/geometry, so
      # offsets are auditable and re-derivable. ONE object-typed group attr; the
      # generic validator type-checks the top-level object only — the nested
      # shape below is writer-enforced (+ writer-side conformance CI), backed by
      # the verbatim `raw_fits_headers [R,A,S]` full-header array:
      #   - per-subscan rotating terms:   POSANGLE, ANGLEDIFF, COSYDEL
      #   - per-pixel/array static geometry: RXDX/RXDY, REFRXDX/REFRXDY,
      #                                      SIGNRXDX/SIGNRXDY
      #   - per-scan:                     FITSVERS
      #   - pixel_offset resolution method marker: direct (PIXOFFX) vs
      #     reconstructed (FITSVERS-gated RXDX→sky-frame rotation — a first-class
      #     derived datum, not a fallback; retiring it would silently collapse
      #     pre-2.12 upGREAT footprints onto the boresight)
      #   - substitution markers: mjd (computed from DATE-OBS vs keyword),
      #     tsky (tamb-substituted vs keyword)
      raw_attrs:        { type: object, required: true }
      # Completeness marker: zarr-fits writes it as the last write of a scan or
      # band (kalibrate#101, write the extended contract). Required since L0 3, as l1_complete is at L1: a
      # reader reads no unit without its completeness marker.
      l0_complete:      { type: boolean, required: true, equals: true }
    groups:
      source:                   # → const SOURCE_GROUP
        # L0 obs sub-group: arrays under scan_<N>/source/, or
        # scan_<N>/band_<B>/source/ when multi-frontend (inline:false).
        placement: scan_or_band
        inline: false
        arrays:
          # data_5d: raw spectrometer counts; axis order C,D,R,A,S (group attr).
          # CHAI FITS stores counts as uint32 through BZERO = 2^31. The fill value
          # is a saturated counter (u32::MAX), never a valid reading.
          data_5d:          { dtype: uint32,  ndim: 5, dims: [channel, dump, receiver, array, subscan], units: ct, required: true, fill_value: 4294967295 }
          # Coordinate arrays (1D [S]); dtype split per the L0 writer's match.
          mjd:              { dtype: float64, ndim: 1, dims: [subscan], units: d, required: true }
          exptime:          { dtype: float32, ndim: 1, dims: [subscan], units: s, required: true }
          elevation:        { dtype: float32, ndim: 1, dims: [subscan], units: rad, required: true }
          azimuth:          { dtype: float32, ndim: 1, dims: [subscan], units: rad, required: true }
          pamb:             { dtype: float32, ndim: 1, dims: [subscan], units: Torr, required: true }
          tamb:             { dtype: float32, ndim: 1, dims: [subscan], units: K, required: true }
          tsky:             { dtype: float32, ndim: 1, dims: [subscan], units: K, required: true, const: TSKY_L0 }  # L0 sky temp; ≠ L1 t_sky
          signal_freq:      { dtype: float64, ndim: 1, dims: [subscan], units: Hz, required: true }
          image_freq:       { dtype: float64, ndim: 1, dims: [subscan], units: Hz, required: true }
          freq_res:         { dtype: float64, ndim: 1, dims: [subscan], units: Hz, required: true }
          freq_off:         { dtype: float64, ndim: 1, dims: [subscan], units: Hz, required: true }
          ref_channel:      { dtype: float32, ndim: 1, dims: [subscan], required: true }
          lloadsn:          { dtype: int32,   ndim: 1, dims: [subscan], required: true }
          # String arrays (the str_array per-language seam): zarr v3 `string`. Most
          # are 1D [S]; frontend_backends and raw_fits_headers are per pixel [R,A,S].
          sobsmode:         { dtype: string,  ndim: 1, dims: [subscan], required: true }
          # Per pixel [R,A,S], the shape of pixel_offset_lon: a CHAI FITS file holds
          # one pixel, so each record has its own header. A cell of frontend_backends
          # holds the record identifier zarr-fits takes from the FITS file name
          # (e.g. HFAV_PX00_S), not the FRONTEND keyword (HFAV_PX00); a cell of
          # raw_fits_headers holds its verbatim header (JSON). A cell with
          # no record (fewer pixels than R) holds the empty string.
          frontend_backends: { dtype: string, ndim: 3, dims: [receiver, array, subscan], required: true }
          raw_fits_headers: { dtype: string,  ndim: 3, dims: [receiver, array, subscan], required: true }
          instmode_subscan: { dtype: string,  ndim: 1, dims: [subscan], required: true }
          nod_beam:         { dtype: string,  ndim: 1, dims: [subscan], required: true }
          chop_freq:        { dtype: float32, ndim: 1, dims: [subscan], units: Hz, required: true, const: CHOP_FREQ_COORD }
          # Dump step inputs (#50, time stamp per dump), typed so no consumer reads
          # raw_fits_headers. Per subscan [S], from the FITS keywords OTFCLEAR,
          # BCKLEN, SPECTIME and OTFSRCYC; a keyword the header lacks is written
          # as 0. Dump j of subscan s spans [start, start + step), with
          #   start = mjd + (otf_clear * bck_len + j * step) / 86400   (days)
          #   step  = otf_srcyc / chop_freq  when otf_srcyc > 0 (chopped OTF)
          #           spec_time              otherwise
          # A subscan without OTF holds one dump (otf_clear = otf_srcyc = 0), so
          # its dump spans spec_time from mjd: a total-power or beam-switch dump
          # spans spec_time, the full integration with both chop phases (exptime
          # is the on-source share). Checked against UTCSTART..UTCEND of the
          # SOFIA upGREAT test files (1 s resolution): chopped OTF 28 dumps x
          # 3/2.5 Hz = 33.6 s vs 34 s, total-power OTF 84 x 0.3 s = 25.2 s vs
          # 25 s, total power 15 s vs 16 s, beam switch 30 s vs 29 s. An OTF OFF
          # subscan of a total-power OTF scan holds one dump that integrates for
          # exptime, not spec_time; L1 holds ON subscans only.
          # Optional: added within L0 3 (an integer version has no minor axis;
          # a reader ignores an unknown array). Absent => an L0 3 store written
          # before #50 (time stamp per dump); calibrate then writes no dump_mjd.
          otf_clear:        { dtype: int32,   ndim: 1, dims: [subscan], required: false }   # OTFCLEAR: backend cycles cleared before dump 0
          bck_len:          { dtype: float64, ndim: 1, dims: [subscan], units: s, required: false }   # BCKLEN: length of one backend cycle
          spec_time:        { dtype: float64, ndim: 1, dims: [subscan], units: s, required: false }   # SPECTIME: dump length without chopping
          otf_srcyc:        { dtype: int32,   ndim: 1, dims: [subscan], required: false }   # OTFSRCYC: chop cycles per dump; 0 = not chopped OTF
          # Source-only geometry: OTF scan track [D,S] and per-pixel offsets [R,A,S].
          # Always written in the `is_source` branch (writer.rs:536-593) → required.
          otf_lon:          { dtype: float64, ndim: 2, dims: [dump, subscan], units: deg, required: true }
          otf_lat:          { dtype: float64, ndim: 2, dims: [dump, subscan], units: deg, required: true }
          pixel_offset_lon: { dtype: float64, ndim: 3, dims: [receiver, array, subscan], units: deg, required: true }
          pixel_offset_lat: { dtype: float64, ndim: 3, dims: [receiver, array, subscan], units: deg, required: true }
          # Per-channel load-temperature tables [C,1,R,A,S]. Only written when a
          # record carries a FITS LOAD_TEMP_ARRAY (HFA HOT/COLD) → required:false.
          # The load temperature is constant across dumps: axis `load_dump` has
          # length 1 and is not the `dump` axis of data_5d.
          load_temp_sig_5d: { dtype: float64, ndim: 5, dims: [channel, load_dump, receiver, array, subscan], units: K, required: false }
          load_temp_img_5d: { dtype: float64, ndim: 5, dims: [channel, load_dump, receiver, array, subscan], units: K, required: false }
          # Valid dump count per subscan [S] (#20, object storage): zarr-fits pads the dump axis
          # D of each subscan to the longest subscan; dumps 0..n-1 of subscan s
          # hold data, the rest is fill. Absent ⇒ a reader takes every dump.
          # A count of dumps: no units attr.
          n_valid_dumps:    { dtype: int32,   ndim: 1, dims: [subscan], required: false }
      calibration:              # → const CALIBRATION_GROUP
        # L0 obs sub-group: arrays under scan_<N>/calibration/, or
        # scan_<N>/band_<B>/calibration/ when multi-frontend (inline:false).
        placement: scan_or_band
        inline: false
        arrays:
          data_5d:          { dtype: uint32,  ndim: 5, dims: [channel, dump, receiver, array, subscan], units: ct, required: true, fill_value: 4294967295 }
          mjd:              { dtype: float64, ndim: 1, dims: [subscan], units: d, required: true }
          exptime:          { dtype: float32, ndim: 1, dims: [subscan], units: s, required: true }
          elevation:        { dtype: float32, ndim: 1, dims: [subscan], units: rad, required: true }
          azimuth:          { dtype: float32, ndim: 1, dims: [subscan], units: rad, required: true }
          pamb:             { dtype: float32, ndim: 1, dims: [subscan], units: Torr, required: true }
          tamb:             { dtype: float32, ndim: 1, dims: [subscan], units: K, required: true }
          tsky:             { dtype: float32, ndim: 1, dims: [subscan], units: K, required: true, const: TSKY_L0 }
          thot:             { dtype: float32, ndim: 1, dims: [subscan], units: K, required: true }   # calibration only
          tcold:            { dtype: float32, ndim: 1, dims: [subscan], units: K, required: true }   # calibration only
          lloadsn:          { dtype: int32,   ndim: 1, dims: [subscan], required: true }
          signal_freq:      { dtype: float64, ndim: 1, dims: [subscan], units: Hz, required: true }
          image_freq:       { dtype: float64, ndim: 1, dims: [subscan], units: Hz, required: true }
          freq_res:         { dtype: float64, ndim: 1, dims: [subscan], units: Hz, required: true }
          freq_off:         { dtype: float64, ndim: 1, dims: [subscan], units: Hz, required: true }
          ref_channel:      { dtype: float32, ndim: 1, dims: [subscan], required: true }
          sobsmode:         { dtype: string,  ndim: 1, dims: [subscan], required: true }
          # Per pixel [R,A,S], as in the source group.
          frontend_backends: { dtype: string, ndim: 3, dims: [receiver, array, subscan], required: true }
          raw_fits_headers: { dtype: string,  ndim: 3, dims: [receiver, array, subscan], required: true }
          instmode_subscan: { dtype: string,  ndim: 1, dims: [subscan], required: true }
          nod_beam:         { dtype: string,  ndim: 1, dims: [subscan], required: true }
          chop_freq:        { dtype: float32, ndim: 1, dims: [subscan], units: Hz, required: true, const: CHOP_FREQ_COORD }
          # Dump step inputs (#50, time stamp per dump), as in the source group.
          otf_clear:        { dtype: int32,   ndim: 1, dims: [subscan], required: false }
          bck_len:          { dtype: float64, ndim: 1, dims: [subscan], units: s, required: false }
          spec_time:        { dtype: float64, ndim: 1, dims: [subscan], units: s, required: false }
          otf_srcyc:        { dtype: int32,   ndim: 1, dims: [subscan], required: false }
          # Load-temperature tables, calibration variant. No otf_*/pixel_offset_*
          # here (the writer's geometry block is source-only). Conditional → false.
          load_temp_sig_5d: { dtype: float64, ndim: 5, dims: [channel, load_dump, receiver, array, subscan], units: K, required: false }
          load_temp_img_5d: { dtype: float64, ndim: 5, dims: [channel, load_dump, receiver, array, subscan], units: K, required: false }
          n_valid_dumps:    { dtype: int32,   ndim: 1, dims: [subscan], required: false }   # [S], as in source
  L1:
    # A store is L1 iff its root group carries this attr (slice-4 detection).
    detect: cal_schema_version
    # L1 root-group attrs (cal-io calibrated.rs:165-173) — both always written.
    # (cal_schema_version itself is negotiated via the `versions` section.)
    root_attrs:
      cal_engine_version: { type: string, required: true }
    # Per-scan-group attrs (calibrated.rs:185-305): what all bands of a scan
    # share. mjd is guarded (finite & >0) and the verbatim L0 identity
    # passthrough is store-dependent → required:false.
    scan_attrs:
      scan_number:          { type: integer, required: true }
      source:               { type: string,  required: true }
      instmode:             { type: string,  required: true }
      raw_instmode:         { type: string,  required: true }
      cal_strategy:         { type: string,  required: true }
      ref_strategy:         { type: string,  required: true }
      cal_scan_numbers:     { type: array,   required: true }
      lloadsn:              { type: array,   required: true }
      mjd:                  { type: number,  required: false }
      mission_id:           { type: string,  required: false }
      aor_id:               { type: string,  required: false }
      # Forwarded verbatim from the L0 scan attrs (#58, maintainer answers on the frame set).
      spectel2:             { type: string,  required: false }
      instcfg:              { type: string,  required: false }
      datasrc:              { type: string,  required: false }
      date_obs:             { type: string,  required: false }
      telescope:            { type: string,  required: false }
      # Observatory location (#19, dimensions, units, frame), forwarded from the L0 root. An airborne
      # observatory writes the not-applicable sentinel here and its position
      # per subscan in the platform_* arrays.
      site_longitude_deg:   { type: number,  required: true, sentinel: true }
      site_latitude_deg:    { type: number,  required: true, sentinel: true }
      site_altitude_m:      { type: number,  required: true, sentinel: true }
    # Per-band-group attrs (multi-frontend only; calibrated.rs:317-341).
    band_attrs:
      band_index:       { type: integer, required: true }
    # Attrs of one calibration: at the scan group when single-frontend, at each
    # band group when multi-frontend (#19, dimensions, units, frame: identity, quality record, provenance
    # and the frame set). In a multi-frontend scan the scan group holds none of
    # them: a scan-or-band attr on that scan group is an error (one value for
    # all bands would be the last band's).
    scan_or_band_attrs:
      line:         { type: string,  required: true }
      rest_freq_hz: { type: number,  required: true }
      # Completeness marker, written last (calibrated.rs:544-549).
      l1_complete:  { type: boolean, required: true, equals: true }
      # Identity, forwarded from L0 (ADR-0007); required since L1 2.0.
      # backend, obs_id, spectel1: verbatim passthrough of one frontend (#34, two spec gaps).
      backend:          { type: string,  required: false }
      obs_id:           { type: string,  required: false }
      spectel1:         { type: string,  required: false }
      arrays:           { type: array,   required: true }
      pixels_per_array: { type: array,   required: true }
      frontend:         { type: string,  required: true }
      # Verbatim source-keyword provenance forwarded from L0. Top-level object
      # type-checked only.
      raw_attrs:        { type: object,  required: true }
      # Quality record.
      qa:               { type: object,  required: true }
      # PWV of the reference pixel of the first fitted OFF (qa
      # pwv_reference_pixels). The PWV of each spectrum is the
      # pwv_spectrum array (#54, per-pixel PWV).
      pwv_mm:           { type: number,  required: true }
      # Provenance: lands only when a Provenance is supplied → required:false.
      cal_hash:             { type: string,  required: false }
      # The L0 store this L1 store was calibrated from (#20, object storage): an RFC 3986 URI
      # reference — an absolute URI (s3://bucket/x.zarr) or a relative reference
      # resolved against the URI of this L1 store, its root taken as a directory
      # (../../zarr/x.zarr). A relative reference survives copying the L0 and L1
      # stores together (site-to-data-center replication); file:/// would tie
      # the link to one host. An empty value, a character outside RFC 3986, an
      # absolute POSIX path (/data/x.zarr) and a file: URI are errors.
      source_l0_store:      { type: string,  required: false, format: uri-reference }
      # The L0 scans this calibration read (#43, spec wording gaps): an object,
      # as cal-io writes it and yoda reads it (keys source_scan, band_index,
      # source_on_subscans, source_off_subscans, cal_scan, cal_band, cal_modes).
      # Top-level object type-checked only.
      source_l0_scans:      { type: object,  required: false }
      cal_config:           { type: object,  required: false }
      processing_timestamp: { type: string,  required: false }
      atm_table_info:       { type: object,  required: false }
      processing_steps:     { type: object,  required: false }
      linked_pwv_source:    { type: object,  required: false }
      # ── Scientific frame (#19, dimensions, units, frame; the names await maintainer approval) ──
      # A required frame field is always present; `sentinel: true` marks one that
      # may not apply.
      # Spectral. TODO(#19, dimensions, units, frame): the channel-to-frequency formula (the base of the
      # L0 ref_channel and the role of freq_off) awaits the science review.
      specsys:           { type: string,  required: true, sentinel: true, enum: [TOPOCENT, GEOCENTR, BARYCENT, HELIOCEN, LSRK, LSRD, GALACTOC] }   # frame of signal_freqs/image_freqs (FITS SPECSYS)
      # Source velocity (#52, frame of the source velocity): vlsr_source is the
      # L0 velocity_source_kms. vlsr_source_frame and veldef state its frame and
      # its convention: LSRK and RELATIVISTIC for KOSMA data (SOFIA/GREAT,
      # CCAT/CHAI). A finite vlsr_source has a vlsr_source_frame and a veldef
      # other than the sentinel.
      veldef:            { type: string,  required: true, sentinel: true, enum: [RADIO, OPTICAL, RELATIVISTIC] }   # velocity convention of vlsr_source (FITS VELDEF)
      vlsr_source:       { type: number,  required: true, sentinel: true }   # systemic velocity of the source, km/s (legacy name, no unit suffix)
      vlsr_source_frame: { type: string,  required: true, sentinel: true, enum: [TOPOCENT, GEOCENTR, BARYCENT, HELIOCEN, LSRK, LSRD, GALACTOC] }   # frame of vlsr_source (SPECSYS vocabulary)
      ref_channel_base:  { type: integer, required: true, enum: [0, 1] }   # base (0 or 1) of the L0 ref_channel
      # Position: the reference position is the ref_lon/ref_lat arrays.
      coord_frame:       { type: string,  required: true, sentinel: true, enum: [ICRS, FK5, FK4, GALACTIC, AZEL] }   # frame of ref_lon/ref_lat and the offsets
      equinox:           { type: number,  required: true, sentinel: true }   # epoch of an FK4/FK5 frame (FITS EQUINOX)
      projection:        { type: string,  required: true, sentinel: true, enum: [SFL, GLS, TAN, SIN, ARC, CAR] }   # FITS projection code of the offsets
      # Offsets (#43, spec wording gaps; ADR 0014, pixel offsets are true-angle
      # offsets): one value governs otf_* and pixel_offset_* together.
      #   equatorial_cosdec: true-angle offsets in the projection plane; the
      #                      longitude offset holds the factor cos(lat)
      #   equatorial_coord:  plain coordinate differences, without cos(lat)
      #   horizontal:        offsets in azimuth and elevation
      # KOSMA data hold true-angle offsets (ADR 0014): equatorial_cosdec.
      offset_convention: { type: string,  required: true, sentinel: true, enum: [equatorial_cosdec, equatorial_coord, horizontal] }   # how otf_* and pixel_offset_* offsets are formed
      # Intensity.
      temperature_scale: { type: string,  required: true, sentinel: true, enum: ["TA*", TMB, "TR*", TB] }   # intensity scale of spectra
      eta_fss:           { type: number,  required: true }   # forward efficiency calibrate applied (eta_f; legacy name)
      eta_mb:            { type: number,  required: true, sentinel: true }   # main-beam efficiency
      gain_el_correction: { type: number, required: true }   # gain-elevation correction calibrate applied
      sideband_mode:     { type: string,  required: true, sentinel: true, enum: [SSB, DSB, USB, LSB] }   # receiver sideband mode
      image_gain:        { type: number,  required: true, sentinel: true }  # image share of the total gain calibrate applied (legacy kalibrate gainimage, FITS GAINIMAG); signal share = 1 - it
    groups:
      # The L1 main arrays sit directly under the scan group (single-frontend) or
      # each band sub-group (multi-frontend) — placement scan_or_band, inline:true
      # (no sub-group path segment). const: false suppresses a SCAN_GROUP const.
      scan:
        const: false
        placement: scan_or_band
        inline: true
        arrays:
          # Always written (calibrated.rs:358-476). Every array with a `subscan`
          # axis shares the subscan axis of spectra: the ON subscans only.
          # spectra and t_sys take float64 (calibrate today) or float32
          # (kalibrate#93, float32 spectra): a dtype set (#20, object storage). A writer that rounds the mantissa
          # (bit rounding) records the kept mantissa bits in the array attr
          # `keepbits`, 0 to 52 (the mantissa bits of float64); absent ⇒ no
          # rounding.
          spectra:      { dtype: [float64, float32], ndim: 5, dims: [channel, dump, receiver, array, subscan], units: K, required: true, attrs: { keepbits: { type: integer, required: false, minimum: 0, maximum: 52 } } }   # calibrated T; C,D,R,A,S
          t_sys:        { dtype: [float64, float32], ndim: 4, dims: [channel, receiver, array, subscan], units: K, required: true, attrs: { keepbits: { type: integer, required: false, minimum: 0, maximum: 52 } } }   # C,R,A,S
          # Integration times per dump (#53, per-dump meaning of t_int and t_off),
          # per ON subscan; a consumer computes the radiometer noise from them.
          # t_int: the ON integration time of one dump, the L0 exptime of the ON
          #   subscan. Not the time of the subscan.
          # t_off: the integration time of the reference that one dump subtracts,
          #   the L0 exptime of the OFF. Twice that time when the reference is the
          #   blend of the beam A and beam B OFFs (legacy kalibrate
          #   buffers.cpp:710; kalibrate PR #219, write twice the OFF time into
          #   t_off for a blended DBS reference). An ON without a partner OFF of
          #   the other beam has no blend.
          #   - cal_strategy totalpower, otf_totalpower: all dumps of a subscan
          #     subtract the same reference. The mean of N dumps has OFF time t_off.
          #   - cal_strategy otf_chopped, beam_switch: each dump subtracts its own
          #     OFF dump. The mean of N dumps has OFF time N * t_off
          #     (yoda PR #90, scale the OFF time with the dump count). A beam_switch subscan
          #     holds one dump.
          t_int:        { dtype: float64, ndim: 1, dims: [subscan], units: s, required: true }   # [S] ON time of one dump
          t_off:        { dtype: float64, ndim: 1, dims: [subscan], units: s, required: true }   # [S] reference time of one dump
          t_rec_ssb:    { dtype: float64, ndim: 3, dims: [channel, receiver, array], units: K, required: true }   # C,R,A
          gamma:        { dtype: float64, ndim: 3, dims: [channel, receiver, array], units: ct/(K s), required: true }   # counts per second per kelvin
          tau_signal:   { dtype: float64, ndim: 1, dims: [channel], units: "", required: true }   # zenith opacity, signal sideband
          tau_image:    { dtype: float64, ndim: 1, dims: [channel], units: "", required: true }   # zenith opacity, image sideband
          # The PWV and the zenith signal opacity that calibrated each spectrum
          # (#54, per-pixel PWV; L1 2.3), per ON subscan: the fit of the OFF of
          # that subscan, per pixel with calibrate --pwv-per-pixel, else the
          # reference-pixel value of that OFF for every pixel. Legacy kalibrate
          # writes them per spectrum as MH2O and TAU-ATM (TAU-ATM: the mean over
          # the channels). NaN where the OFF fit failed. pwv_mm, tau_signal and
          # tau_image keep the reference pixel of the first fitted OFF.
          # Optional: an L1 2.2 store lacks them.
          pwv_spectrum:        { dtype: float64, ndim: 3, dims: [receiver, array, subscan], units: mm, required: false }
          tau_signal_spectrum: { dtype: float64, ndim: 4, dims: [channel, receiver, array, subscan], units: "", required: false }
          t_sky:        { dtype: float64, ndim: 3, dims: [channel, receiver, array], units: K, required: true }   # C,R,A; ≠ L0 tsky
          s_h_obs:      { dtype: float64, ndim: 1, dims: [channel], units: K, required: true }   # [C] observed sky-hot
          t_sky_fit:    { dtype: float64, ndim: 1, dims: [channel], units: K, required: true }   # [C] ATM-model sky
          t_cal:        { dtype: float64, ndim: 1, dims: [channel], units: K, required: true }   # [C] cal factor (t_cal_1d)
          flags:        { dtype: uint16,  ndim: 5, dims: [channel, dump, receiver, array, subscan], required: true }
          signal_freqs: { dtype: float64, ndim: 1, dims: [channel], units: Hz, required: true }
          image_freqs:  { dtype: float64, ndim: 1, dims: [channel], units: Hz, required: true }
          # Conditional (calibrated.rs:478-537): lloadsn skipped when empty; OTF
          # and pixel-offset arrays are Option and only present for OTF/mapping.
          lloadsn:          { dtype: int32,   ndim: 1, dims: [subscan], required: false }
          otf_lon:          { dtype: float64, ndim: 2, dims: [dump, subscan], units: deg, required: false }
          otf_lat:          { dtype: float64, ndim: 2, dims: [dump, subscan], units: deg, required: false }
          otf_airmass:      { dtype: float64, ndim: 2, dims: [dump, subscan], units: "", required: false }
          pixel_offset_lon: { dtype: float64, ndim: 3, dims: [receiver, array, subscan], units: deg, required: false }
          pixel_offset_lat: { dtype: float64, ndim: 3, dims: [receiver, array, subscan], units: deg, required: false }
          # Valid dump count per subscan [S] (#20, object storage): spectra keeps the padded D
          # axis of L0, so the L0 count carries over. A count of dumps: no units.
          n_valid_dumps:    { dtype: int32,   ndim: 1, dims: [subscan], required: false }
          # Time stamp per dump (#50, time stamp per dump; L1 2.1): the MJD (UTC)
          # of the physical middle of each dump: dump start + dump step / 2 of the L0
          # source group (otf_clear, bck_len, spec_time, otf_srcyc).
          # Per ON subscan (the subscan axis of spectra). A dump past
          # n_valid_dumps holds NaN. A merged beam pair (calibrate
          # --merge-beams) keeps the time of beam A, as it keeps its otf_lon.
          # Optional: an L1 2.0 store lacks it, and
          # calibrate writes it only when L0 holds the dump step inputs.
          # Legacy kalibrate stamps the start of an OTF dump instead, and steps a
          # chopped OTF dump by 1 / chop_freq, ignoring otf_srcyc
          # (ccatobs/kalibrate#203, legacy chopped OTF time stamps).
          dump_mjd:         { dtype: float64, ndim: 2, dims: [dump, subscan], units: d, required: false }
          # Scientific frame (#19, dimensions, units, frame), per ON subscan (the subscan axis of spectra).
          # NaN fill = not applicable.
          # v_frame (#58, maintainer answers on the frame set; L1 2.2): the frame
          # correction from the topocentric frame to LSRK, v_lsr - v_topo =
          # velocity_source_kms - v_frame_kms of L0, the same value for every ON
          # subscan. v_lsr = v_topo + v_frame. The velocities compose
          # relativistically: a consumer shifts the topocentric frequency by
          # f_lsr = f * D(v_frame), D(v) = sqrt((1 - v/c) / (1 + v/c)), and
          # then expresses f_lsr in the convention it chooses (radio
          # c (1 - f_lsr / rest_freq_hz), optical or relativistic). The
          # radio formula on the topocentric f plus a linear v_frame is off by
          # up to 14 km/s at 2888 km/s (#59, v_frame conversion; yoda #105 (velocity axis convention)).
          # Not the raw FITS VFRAME (L0
          # v_frame_kms, the total velocity). NaN when either L0 value is
          # missing or null, and for an ephemeris source (name starts with @ or
          # #): the control software then ignores the source velocity and VFRAME
          # holds no LSR term. A source the telescope does not track (sky dip,
          # OCRF_*) has VFRAME = 0 and source velocity 0, so v_frame = 0: no
          # Doppler correction was applied.
          v_frame:      { dtype: float64, ndim: 1, dims: [subscan], units: km/s, required: true }  # frame correction to LSRK, v_lsr - v_topo
          ref_lon:      { dtype: float64, ndim: 1, dims: [subscan], units: deg, required: true }   # reference position, in coord_frame
          ref_lat:      { dtype: float64, ndim: 1, dims: [subscan], units: deg, required: true }
          platform_lon: { dtype: float64, ndim: 1, dims: [subscan], units: deg, required: true }   # position of an airborne observatory
          platform_lat: { dtype: float64, ndim: 1, dims: [subscan], units: deg, required: true }
          platform_alt: { dtype: float64, ndim: 1, dims: [subscan], units: m, required: true }
      skydiff:                  # → const SKYDIFF_GROUP
        # Diagnostic sub-group under the scan/band group (diagnostic modes only).
        placement: scan_or_band
        inline: false
        arrays:
          # On disk: spectrum_<h>, matched as the `spectrum_` family (every array
          # whose name starts with the prefix). The const is the "spectrum" stem.
          spectrum:     { dtype: float64, ndim: 3, dims: [channel, receiver, array], units: K, required: false, prefix: spectrum_, const: SKYDIFF_SPECTRUM }
      skychopdiff:             # → const SKYCHOPDIFF_GROUP
        placement: scan_or_band
        inline: false
        arrays:
          # On disk: spectrum_<on>_<j>, matched as the `spectrum_` family.
          spectrum:     { dtype: float64, ndim: 3, dims: [channel, receiver, array], units: K, required: false, prefix: spectrum_, const: SKYCHOPDIFF_SPECTRUM }

# Ordered name lists → `pub const … : &[&str]` (membership/routing; exact order).
lists:
  SOURCE_COORDS: [mjd, exptime, elevation, azimuth, pamb, tamb, tsky,
                  signal_freq, image_freq, freq_res, freq_off, ref_channel, lloadsn]
  CAL_COORDS:    [mjd, exptime, elevation, azimuth, pamb, tamb, tsky, thot, tcold,
                  lloadsn, signal_freq, image_freq, freq_res, freq_off, ref_channel]
  SOURCE_MODES:  ["ON", "OFF", "OTF-ON", "OTF-OFF"]
  CAL_MODES:     ["HOT", "COL", "COLD", "SKY", "ZERO"]
  # The required L1 frame set (#19, dimensions, units, frame): its attrs,
  # at scan-or-band placement and, for the site, at scan placement.
  FRAME_ATTRS:   [specsys, veldef, vlsr_source, vlsr_source_frame, ref_channel_base,
                  coord_frame, equinox, projection, offset_convention,
                  temperature_scale, eta_fss, eta_mb, gain_el_correction,
                  sideband_mode, image_gain, site_longitude_deg, site_latitude_deg,
                  site_altitude_m]

# Single attribute-name constants → `pub const … : &str`.
markers:
  L0_COMPLETE_ATTR: l0_complete   # written last on an L0 scan/band group; absence ⇒ untrusted
  L1_COMPLETE_ATTR: l1_complete   # written last on an L1 scan/band group; absence ⇒ untrusted

# Bit table of the L1 `flags` array (uint16): key = const identifier, value =
# bit index → `pub const NAME: u16 = 1 << bit` (Python: an int of the same
# value). A datum is good when flags == 0. Calibrate sets bits 0, 1 and 8, bits
# 2-7 are set downstream; bits 9-15 are reserved. Bit 5 is ELEVATION_LOW, as calibrate
# (cal-core/src/flags.rs) and YODA (io/flags.py) write it.
flag_bits:
  BAD_CHANNEL: 0      # calibrate: bad channel (hot <= cold, t_rec out of range)
  # FILL_VALUE (#43, spec wording gaps): calibrate writes NaN into spectra and
  # sets the bit when the raw data are missing or corrupt, or when its result
  # is not finite (kalibrate#115, close three legacy-parity gaps of the
  # atmosphere path; PR #160, T_sys at the OFF conditions).
  # Missing: the L0 fill value. Corrupt: a count of 0, or a count rate above
  # 10 times its channel median over the scan (kalibrate PR #221, read a count
  # above 10 times its channel median as missing).
  FILL_VALUE: 1       # calibrate: raw data missing or corrupt, or a value calibrate cannot calibrate
  SPIKE: 2            # reduction: spike
  RFI: 3              # reduction: radio-frequency interference
  TSYS_OUTLIER: 4     # reduction: t_sys outside its threshold
  ELEVATION_LOW: 5    # reduction: low elevation
  ML_FLAGGED: 6       # reduction: flagged by a machine-learning model
  MANUAL: 7           # reduction: flagged by hand
  LOW_TRANSMISSION: 8 # calibrate: channel transmission below the min_transmission option (saturated atmospheric line)

# Validator-only spec data (generates NO Rust const): for each canonical
# attribute, the ordered list of source FITS keywords it may be resolved from,
# highest precedence first. Documents resolution provenance — that `pixel_offset`
# comes from PIXOFFX (direct, ≥2.12) else RXDX (FITSVERS-gated sky-frame
# reconstruction). The generic validator does NOT enforce precedence; the L0
# producer applies the deterministic, profile-selected strategy and records the
# method + inputs in `raw_attrs`.
precedence_aliases:
  pixel_offset: { from: [PIXOFFX, RXDX] }

# ── RESERVED (ADR-0008) — activated in later slices ──
#
# placement:                    # #5 (full L0+L1 contract) — ARBITRARY archive nesting + the scan-or-band rule
#   hierarchy: [flight, scan, band]      # real L0 today: scan_{N}/{source|calibration}/data_5d
#
